# Site metadata for the static copy of fuzzy-sl (schema: PRIMER.md of wikibase-static, A4).
title: fuzzy-sl (static copy)
description: Static, read-only copy of the Wikibase fuzzy-sl.wikibase.cloud. The data was archived with wikibase-static; nothing on these pages can be edited.
source:
  url: https://fuzzy-sl.wikibase.cloud
# Where docs/ is published; the RDF export needs it for the download URLs of its DCAT distributions.
pages_url: https://n4o-rse.github.io/fuzzy-sl-static/
# The URIs of the RDF export and the concept URIs are those of this site, not of the source Wikibase: if that is gone,
# nothing here may point to it. (Without this line the base would be source.url.)
rdf_base: https://n4o-rse.github.io/fuzzy-sl-static
languages:
  default: en
  second: de
# fuzzy-sl keeps the formatter URL of external-id properties in its own property P18 (Wikidata uses P1630).
formatter_property: P18
# Logo, top left on every page. The file is in this repository and is copied to docs/assets/logo/, so the
# pages never load it from the source Wikibase. (A URL works too, but then every page loads the image from there.)
logo: assets/logo.jpg
